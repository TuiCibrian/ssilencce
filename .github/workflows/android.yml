name: Android CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "assets/"
      - "metadata/"
      - '.gitignore'
      - "*.md"
      - "LICENSE.txt"
  pull_request:
    branches-ignore: [ "stable" ]
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/**"
      - ".idea/"
      - "assets/"
      - "metadata/"
      - '.gitignore'
      - "*.md"
      - "LICENSE.txt"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          java-version: 21
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint and ktlint
        run: ./gradlew lint ktlintCheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        java-version: 21
        distribution: 'zulu'
        cache: gradle

    - name: Create files for signing
      if: github.event_name != 'pull_request'
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PROPERTIES: ${{ secrets.SIGNING_PROPERTIES }}
      run: |
        echo $SIGNING_KEY | base64 -di > ./ssilencce_keystore.jks
        echo $SIGNING_PROPERTIES | base64 -di > ./keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create Last.fm config
      if: github.event_name != 'pull_request'
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
      run: |
        PROPERTIES_FILE="local.properties"

        echo "LASTFM_API_KEY=${LASTFM_API_KEY}" >> $PROPERTIES_FILE
        echo "LASTFM_SECRET=${LASTFM_SECRET}" >> $PROPERTIES_FILE

    - name: Build with Gradle
      run: |
        if [ "$EVENT_NAME" = "pull_request" ]; then
          ./gradlew assembleDebug
        else
          ./gradlew assembleRelease
        fi
      env:
        RELEASE_TYPE: "CI"
        EVENT_NAME: ${{ github.event_name }}

    - name: Find APK
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          APK_PATH=$(find app/build/outputs/apk/github/debug -name '*.apk')
        else
          APK_PATH=$(find app/build/outputs/apk/github/release -name '*.apk')
        fi
        echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
        echo "APK_FILE_NAME=$(basename $APK_PATH .apk)" >> $GITHUB_ENV

    - name: Upload apk
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
      with:
        name: ${{ env.APK_FILE_NAME }}
        path: ${{ env.APK_FILE }}
        archive: false